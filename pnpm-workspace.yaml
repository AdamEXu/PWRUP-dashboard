packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - protobufjs
  - sharp
  - unrs-resolver

# Pin Zod 4 to 4.6.5 (supply-chain aged ≥7d as of 2026-09-21).
# Pin electron 44.7.0 and @types/node 22.20.4; hold electron 44.7.2+ / 44.8+ / 45 alphas and @types/node 26.
# Pin lucide-react 1.55.0; hold 1.56+.
overrides:
  zod@^4.0.0: 4.6.5
  electron: 44.7.0
  "@types/node@^22.20.4": 22.20.4
  lucide-react: 1.55.0
