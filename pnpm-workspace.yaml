packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - protobufjs
  - sharp
  - unrs-resolver

# Pin every Zod copy to 4.6.7 (GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404). 4.6.6 is the
# first patched 4.x; there is no patched 3.x. Force ntcore-ts-client's zod ^3.24.3
# onto 4.6.7 as well so no 3.x remains in the tree.
# Pin electron 44.10.0 (GHSA-jr5w-w6x2-84p9 was fixed in 44.9.1); hold electron 45 alphas and @types/node 26.
# Pin lucide-react 1.63.0; hold newer lucide than this vetted release.
# Pin Radix UI, protobufjs, and concurrently to vetted versions (do not float past these).
# Pin @react-three/fiber 9.8.1; 9.8.2 was hand-published without provenance.
# Next.js 16.4.5 (Nov 2026 security release / GHSA-mfr8-8qww-v76h / CVE-2026-119790).
# CVE-2026-96889 floor remains 16.4.2. Image optimizer still requires sharp >=0.35.5.
overrides:
  zod: 4.6.7
  electron: 44.10.0
  "@types/node@^22.20.5": 22.20.5
  lucide-react: 1.63.0
  "@radix-ui/react-collapsible": 1.2.1
  "@radix-ui/react-dialog": 1.3.1
  "@radix-ui/react-dropdown-menu": 2.2.1
  "@radix-ui/react-label": 2.1.17
  "@radix-ui/react-scroll-area": 1.4.0
  "@radix-ui/react-separator": 1.2.0
  "@radix-ui/react-slider": 1.6.1
  "@radix-ui/react-slot": 1.5.0
  "@radix-ui/react-switch": 1.4.1
  "@radix-ui/react-tabs": 1.2.1
  "@radix-ui/react-tooltip": 1.4.1
  "@react-three/fiber": 9.8.1
  protobufjs: 8.8.1
  concurrently: 10.0.6
  sharp: ">=0.35.5"
  next: 16.4.5
