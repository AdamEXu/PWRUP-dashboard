packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - protobufjs
  - sharp
  - unrs-resolver

# Pin Zod 4 to 4.6.5 (supply-chain aged ≥7d as of 2026-09-21).
# Pin electron 44.4.3 and @types/node 22.20.4; hold 44.4.4+ and @types/node 26.
# Pin lucide-react 1.47.0; hold 1.48.0+.
overrides:
  zod@^4.0.0: 4.6.5
  electron: 44.4.3
  "@types/node@^22.20.4": 22.20.4
  lucide-react: 1.47.0
