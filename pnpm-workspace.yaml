packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - protobufjs
  - sharp
  - unrs-resolver

# Pin Zod 4 to 4.6.5 (supply-chain aged ≥7d as of 2026-09-21).
# Pin electron 44.4.1 and @types/node 22.20.3; hold 44.4.2+ and 22.20.4+.
overrides:
  zod@^4.0.0: 4.6.5
  electron: 44.4.1
  "@types/node@^22.20.3": 22.20.3
